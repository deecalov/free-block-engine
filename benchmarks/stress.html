<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Block Engine — stress benchmark</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .panel {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 14px;
        background: #1f2937;
        color: #f9fafb;
        font-size: 13px;
      }

      .panel button,
      .panel input,
      .panel select {
        font: inherit;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid #4b5563;
        background: #374151;
        color: inherit;
        cursor: pointer;
      }

      .panel input[type='number'] {
        width: 90px;
        cursor: text;
      }

      .panel label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }

      #results {
        margin-left: auto;
        font-family: monospace;
        white-space: pre;
      }

      #canvas {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <label>
        Blocks
        <input type="number" id="blockCount" value="1000" min="10" max="20000" step="100" />
      </label>
      <label>
        Links per block
        <input type="number" id="linkRatio" value="1" min="0" max="4" step="1" />
      </label>
      <button id="generateBtn">Generate</button>
      <button id="panBtn">Measure pan FPS</button>
      <button id="dragBtn">Measure drag FPS</button>
      <button id="fitBtn">Zoom to fit</button>
      <label><input type="checkbox" id="cullToggle" /> cullOffscreen</label>
      <label><input type="checkbox" id="minimapToggle" checked /> minimap</label>
      <div id="results">ready</div>
    </div>

    <div id="canvas"></div>

    <script src="../dist/free-block-engine.global.js"></script>
    <script src="stress.js"></script>
  </body>
</html>
