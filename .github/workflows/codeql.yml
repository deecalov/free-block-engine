name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, csharp]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          # The C# project cannot be autobuilt: its csproj fails by design
          # until the JS bundle exists in dist/, so we build it manually.
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}

      - uses: actions/setup-node@v4
        if: matrix.language == 'csharp'
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x

      - name: Build the .NET example
        if: matrix.language == 'csharp'
        run: |
          npm ci
          npm run build
          dotnet build examples/aspnetcore.Tests --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
