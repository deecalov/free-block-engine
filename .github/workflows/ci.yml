name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest 4 and ESLint 10 require Node 20+; 18 is not supported by the toolchain.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:coverage

  build:
    name: Lint, build and .NET example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run size

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Builds the example through its ProjectReference as well.
      - name: Test ASP.NET Core example
        run: dotnet test examples/aspnetcore.Tests --configuration Release
