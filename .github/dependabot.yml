version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  # Only the test project carries PackageReferences; the web example has none.
  - package-ecosystem: nuget
    directory: /examples/aspnetcore.Tests
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
